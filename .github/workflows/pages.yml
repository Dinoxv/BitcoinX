# Workflow xuat ban website + logo + token list len GitHub Pages.
#
# De Pages thuc su len song, trong repo: Settings -> Pages -> Source = GitHub Actions.
# Sau do chay `npm run assets:mainnet` va commit web/config.js da sinh.
#
# Sau khi bat, dat LOGO_BASE_URL trong .env thanh:
#   https://<user>.github.io/<repo>/brand
# roi chay lai `npm run assets:mainnet` de token list tro dung URL logo that.

name: Deploy BitcoinX site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "brand/**"
      - "tokenlist/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p site/brand site/tokenlist
          cp web/index.html site/
          cp web/config.js site/
          cp brand/*.png brand/*.svg site/brand/
          cp tokenlist/*.json site/tokenlist/ 2>/dev/null || true
          # index.html tham chieu ../brand va ../tokenlist; o Pages no nam o goc.
          sed -i 's#\.\./brand/#brand/#g; s#\.\./tokenlist/#tokenlist/#g' site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
